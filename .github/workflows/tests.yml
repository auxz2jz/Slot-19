name: Python acquisition candidate checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and verify FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version
      - name: Compile source
        run: python -m compileall -q videogrammetry tests
      - name: Run targeted tests
        run: python -m unittest discover -s tests -v
      - name: Check declared engine statuses
        run: python -m videogrammetry engines
