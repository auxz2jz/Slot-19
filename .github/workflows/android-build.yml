name: Android APK candidate

on:
  push:
    branches: [main]
    paths:
      - "android/app/**"
      - "android/build.gradle.kts"
      - "android/settings.gradle.kts"
      - "android/gradle.properties"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out both platform histories without changing them
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK and install required packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Read Android app version for APK artifact names
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build Android APK and run unit tests
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists and fingerprint
        run: |
          APK_DIR=android/app/build/outputs/apk/debug
          test -s "$APK_DIR/app-arm64-v8a-debug.apk"
          test -s "$APK_DIR/app-universal-debug.apk"
          mkdir -p android-artifact
          cp "$APK_DIR/app-arm64-v8a-debug.apk" android-artifact/Video3DCapture-Android-v${{ steps.app_version.outputs.version }}-ARM64-CANDIDATE.apk
          cp "$APK_DIR/app-universal-debug.apk" android-artifact/Video3DCapture-Android-v${{ steps.app_version.outputs.version }}-UNIVERSAL-CANDIDATE.apk
          cd android-artifact
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
      - name: Upload Android APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: video3d-android-v${{ steps.app_version.outputs.version }}-candidate
          path: android-artifact/
          retention-days: 60
          if-no-files-found: error
